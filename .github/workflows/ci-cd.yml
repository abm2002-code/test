name: CI/CD Pipeline

on:
  push:
    branches: [ dev2 ]
  pull_request:
    branches: [ main ]
    types: [closed]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f task-manager/app/requirements.txt ]; then pip install -r task-manager/app/requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 task-manager/app --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,*/venv/*
          flake8 task-manager/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,*/venv/*

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} -f task-manager/app/Dockerfile task-manager/app
      - name: Test Docker image
        run: |
          docker images
          echo "Docker image built successfully"

  deploy:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev2') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: task-manager/app
          file: task-manager/app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }},${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:latest

      - name: Verify Minikube Status
        run: |
          minikube status
          kubectl cluster-info

      - name: Configure kubectl to use Minikube
        run: |
          kubectl config use-context minikube
          kubectl cluster-info

      - name: Deploy to Minikube
        run: |
          # Apply ConfigMap and Secret first
          kubectl apply -f task-manager/k8s-manifests/configmap.yaml
          kubectl apply -f task-manager/secret.yaml

          # Apply MongoDB resources
          kubectl apply -f task-manager/k8s-manifests/mongodb-deployment.yaml
          kubectl apply -f task-manager/k8s-manifests/mongodb-service.yaml

          # Apply Flask deployment with updated image
          kubectl apply -f task-manager/k8s-manifests/flask-deployment.yaml
          kubectl set image deployment/flask-app flask-app=${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }}

          # Apply Flask service
          kubectl apply -f task-manager/k8s-manifests/flask-service.yaml

          # Wait for deployments to be ready
          kubectl rollout status deployment/flask-app
          kubectl rollout status deployment/mongodb

          echo "Deployment completed successfully!"
