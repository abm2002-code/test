name: CI/CD Pipeline

on:
  push:
    branches: [ dev2, main ]
  pull_request:
    branches: [ main ]
    types: [closed]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f task-manager/app/requirements.txt ]; then pip install -r task-manager/app/requirements.txt; fi
      - name: Lint with flake8
        run: |
          # Exclude venv directory from linting
          flake8 task-manager/app --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,*/venv/*
          flake8 task-manager/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,*/venv/*

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} -f task-manager/app/Dockerfile task-manager/app
      - name: Test Docker image
        run: |
          docker images
          echo "Docker image built successfully"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Modified condition to run on push to dev2 branch or when PRs are merged to main
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev2') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: task-manager/app
          file: task-manager/app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }},${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:latest
      
      - name: Update Kubernetes manifests
        run: |
          # Check if the file exists
          if [ -f "k8s-manifests/flask-deployment.yaml" ]; then
            echo "Found flask-deployment.yaml file"
            # Print the current content for debugging
            cat k8s-manifests/flask-deployment.yaml
            # Use a more specific pattern for replacement
            sed -i "s|image: .*task-manager:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }}|g" k8s-manifests/flask-deployment.yaml
            # Check if any changes were made
            git diff --name-only
            # Configure git
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            # Add the file even if there are no changes (force)
            git add -f k8s-manifests/flask-deployment.yaml
            # Commit with a more detailed message
            git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
            # Push with force if needed
            git push
          else
            echo "Error: flask-deployment.yaml file not found at k8s-manifests/flask-deployment.yaml"
            # List files in the directory to debug
            ls -la
            ls -la k8s-manifests/ || echo "k8s-manifests directory not found"
          fi
      
      - name: Update Kubernetes deployment
        run: |
          echo "Updating Kubernetes deployment with new image"
          # In a real environment, you would use kubectl here
          echo "kubectl apply -f ./k8s-manifests/"
          echo "kubectl rollout restart deployment flask-deployment"