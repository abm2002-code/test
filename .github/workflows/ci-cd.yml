name: CI/CD Pipeline

on:
  push:
    branches: [ dev2, main ]  
    paths:
      - '.github/workflows/**'  # Trigger workflow when GitHub Actions files change
  pull_request:
    branches: [ main ]
    types: [closed]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f task-manager/app/requirements.txt ]; then pip install -r task-manager/app/requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 task-manager/app --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,*/venv/*
          flake8 task-manager/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,*/venv/*

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} -f task-manager/app/Dockerfile task-manager/app
      - name: Test Docker image
        run: |
          docker images
          echo "Docker image built successfully"

  deploy:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/workflows/'))
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: task-manager/app
          file: task-manager/app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }},${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:latest
      
      - name: Update Kubernetes manifests
        run: |
          if [ -f "task-manager/k8s-manifests/flask-deployment.yaml" ]; then
            sed -i "s|image: .*task-manager:.*|image: ${{ secrets.DOCKER_HUB_USERNAME }}/task-manager:${{ github.sha }}|g" k8s-manifests/flask-deployment.yaml
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add k8s-manifests/flask-deployment.yaml
            git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "Error: flask-deployment.yaml file not found"
            exit 1
          fi

      - name: Update Kubernetes deployment
        run: |
          echo "Updating Kubernetes deployment with new image"
          echo "kubectl apply -f ./k8s-manifests/"
          echo "kubectl rollout restart deployment flask-deployment"
