<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Task Manager</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">Add New Task</div>
                    <div class="card-body">
                        <form action="{{ url_for('add_task') }}" method="POST">
                            <div class="input-group">
                                <input type="text" name="content" class="form-control" placeholder="Enter task..." required>
                                <button class="btn btn-primary" type="submit">Add Task</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">Tasks</div>
                    <ul class="list-group list-group-flush">
                        {% if tasks %}
                            {% for task in tasks %}
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span {% if task.completed %}class="text-decoration-line-through"{% endif %}>
                                        {{ task.content }}
                                    </span>
                                    <div>
                                        {% if not task.completed %}
                                            <a href="{{ url_for('complete_task', task_id=task._id) }}" class="btn btn-sm btn-success">Complete</a>
                                        {% endif %}
                                        <a href="{{ url_for('delete_task', task_id=task._id) }}" class="btn btn-sm btn-danger">Delete</a>
                                    </div>
                                </li>
                            {% endfor %}
                        {% else %}
                            <li class="list-group-item text-center">No tasks yet!</li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
