apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  selector:
    matchLabels:
      app: flask-app
  replicas: 2
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: task-manager:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: flask-secret-key
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongo-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongo-password
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mongo-host
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mongo-port
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: mongo-db
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: debug-mode